
    <svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <style>
                @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
                
                * { font-family: 'Share Tech Mono', monospace; }
                
                .bg { fill: #0D1117; }
                .grid { stroke: rgba(0, 255, 255, 0.05); stroke-width: 1; }
                
                .cyan { fill: #00F5FF; filter: drop-shadow(0 0 5px rgba(0, 245, 255, 0.6)); }
                .magenta { fill: #FF00FF; filter: drop-shadow(0 0 5px rgba(255, 0, 255, 0.6)); }
                .green { fill: #00FF66; filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.6)); }
                .yellow { fill: #FFEB3B; filter: drop-shadow(0 0 5px rgba(255, 235, 59, 0.6)); }
                .red { fill: #FF3333; filter: drop-shadow(0 0 5px rgba(255, 51, 51, 0.6)); }
                .white { fill: #E0E0E0; }
                .dim { fill: #8B949E; }
                
                .title { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
                .big-number { font-size: 46px; font-weight: bold; }
                .label { font-size: 12px; letter-spacing: 1px; }
                .stat-value { font-size: 15px; font-weight: bold; }
                
                .glitch { animation: glitch-anim 3s infinite alternate; }
                @keyframes glitch-anim {
                    0% { transform: translate(0); opacity: 1; }
                    20% { transform: translate(-2px, 1px); }
                    21% { transform: translate(2px, -1px); opacity: 0.8; }
                    22% { transform: translate(0); opacity: 1; filter: drop-shadow(0 0 10px #00F5FF) drop-shadow(-2px 0 #FF00FF); }
                    25% { filter: drop-shadow(0 0 5px rgba(0, 245, 255, 0.6)); }
                    100% { transform: translate(0); }
                }

                .pulse { animation: pulse-anim 2s infinite; }
                @keyframes pulse-anim {
                    0% { filter: drop-shadow(0 0 2px #FF00FF); }
                    50% { filter: drop-shadow(0 0 8px #FF00FF); }
                    100% { filter: drop-shadow(0 0 2px #FF00FF); }
                }

                .blink { animation: blink-anim 1.5s infinite ease-in-out; }
                @keyframes blink-anim {
                    0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #FF3333); }
                    50% { opacity: 0.2; filter: none; }
                }

                .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 4.5; }
                .ring {
                    fill: none;
                    stroke-width: 4.5;
                    stroke-linecap: round;
                    stroke-dasharray: 150.79644737231007;
                    transform: rotate(-90deg);
                    transform-origin: center;
                }
            </style>

            <pattern id="gridPattern" width="25" height="25" patternUnits="userSpaceOnUse">
                <path d="M 25 0 L 0 0 0 25" fill="none" class="grid"/>
            </pattern>
        </defs>

        <rect width="100%" height="100%" class="bg" rx="8"/>

        <text x="25" y="30" class="cyan title">LEETCODE_SYSTEM::TELEMETRY</text>
        <line x1="25" y1="40" x2="310" y2="40" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
        <line x1="295" y1="40" x2="310" y2="28" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
        
        <g transform="translate(720, 28)">
            <circle cx="0" cy="-4" r="4" fill="#FF3333" class="blink"/>
            <text x="12" y="0" class="red" style="font-size: 12px; font-weight: bold; letter-spacing: 2px;">LIVE</text>
        </g>
        
        <g transform="translate(25, 65)">
            <text x="0" y="0" class="dim label">TOTAL_SOLVED</text>
            <text x="0" y="46" class="cyan big-number glitch">1067</text>
            <text x="0" y="72" class="dim label">ALGORITHMS &amp; DATA STRUCTURES</text>
        </g>

        <g transform="translate(260, 52)">
            <rect x="0" y="0" width="230" height="105" fill="rgba(255,0,255,0.05)" stroke="#FF00FF" stroke-width="1" rx="6" opacity="0.3"/>
            <text x="15" y="22" class="dim label">CONTEST_RATING</text>
            <text x="15" y="56" class="magenta big-number pulse" style="font-size: 30px;">1821</text>
            <text x="15" y="78" class="dim label">GLOBAL_RANK: <tspan class="white">63242</tspan></text>
            <text x="15" y="95" class="dim label">ATTENDED: <tspan class="white">82</tspan></text>
        </g>

        <g transform="translate(515, 95)">
            <g transform="translate(45, 0)">
                <circle cx="0" cy="0" r="24" class="ring-bg"/>
                <circle cx="0" cy="0" r="24" class="ring green" style="stroke-dashoffset: 96.66801312339277; filter: drop-shadow(0 0 5px #00FF66);" />
                <text x="0" y="4" class="white stat-value" text-anchor="middle">383</text>
                <text x="0" y="44" class="green label" text-anchor="middle">EASY</text>
            </g>
            
            <g transform="translate(140, 0)">
                <circle cx="0" cy="0" r="24" class="ring-bg"/>
                <circle cx="0" cy="0" r="24" class="ring yellow" style="stroke-dashoffset: 63.31472204573093; filter: drop-shadow(0 0 5px #FFEB3B);" />
                <text x="0" y="4" class="white stat-value" text-anchor="middle">619</text>
                <text x="0" y="44" class="yellow label" text-anchor="middle">MEDIUM</text>
            </g>

            <g transform="translate(235, 0)">
                <circle cx="0" cy="0" r="24" class="ring-bg"/>
                <circle cx="0" cy="0" r="24" class="ring red" style="stroke-dashoffset: 141.61015957549643; filter: drop-shadow(0 0 5px #FF3333);" />
                <text x="0" y="4" class="white stat-value" text-anchor="middle">65</text>
                <text x="0" y="44" class="red label" text-anchor="middle">HARD</text>
            </g>
        </g>
        
        <text x="740" y="168" class="dim" style="font-size: 9px;">v3.0_SLIM</text>
    </svg>