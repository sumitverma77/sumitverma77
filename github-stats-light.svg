
    <svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <style>
                @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
                
                * { font-family: 'Share Tech Mono', monospace; }
                
                .bg { fill: #FFFFFF; }
                .grid { stroke: rgba(0, 0, 0, 0.05); stroke-width: 1; }
                
                .cyan { fill: #0099CC; filter: drop-shadow(0 0 3px rgba(0, 153, 204, 0.4)); }
                .magenta { fill: #CC00CC; filter: drop-shadow(0 0 3px rgba(204, 0, 204, 0.4)); }
                .green { fill: #008833; filter: drop-shadow(0 0 3px rgba(0, 136, 51, 0.4)); }
                .orange { fill: #CC6600; filter: drop-shadow(0 0 3px rgba(204, 102, 0, 0.4)); }
                .purple { fill: #8800CC; filter: drop-shadow(0 0 3px rgba(136, 0, 204, 0.4)); }
                .white { fill: #1F2328; }
                .dim { fill: #656D76; }
                
                .title { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
                .big-number { font-size: 46px; font-weight: bold; }
                .label { font-size: 12px; letter-spacing: 1px; }
                .stat-value { font-size: 16px; font-weight: bold; }
                
                .glitch { animation: glitch-anim 3s infinite alternate; }
                @keyframes glitch-anim {
                    0% { transform: translate(0); opacity: 1; }
                    20% { transform: translate(-2px, 1px); }
                    21% { transform: translate(2px, -1px); opacity: 0.8; }
                    22% { transform: translate(0); opacity: 1; filter: drop-shadow(0 0 10px #008833) drop-shadow(-2px 0 #8800CC); }
                    25% { filter: drop-shadow(0 0 3px rgba(0, 136, 51, 0.4)); }
                    100% { transform: translate(0); }
                }

                .blink { animation: blink-anim 1.5s infinite ease-in-out; }
                @keyframes blink-anim {
                    0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #CC0000); fill: #CC0000;}
                    50% { opacity: 0.2; filter: none; stroke: #CC0000; stroke-width: 1; }
                }
                .live-text {
                    fill: #CC0000;
                    filter: drop-shadow(0 0 4px rgba(204,0,0,0.7));
                }
            </style>
        </defs>

        <rect width="100%" height="100%" class="bg" rx="8"/>

        <text x="25" y="30" class="green title">GITHUB_SYSTEM::TELEMETRY</text>
        <line x1="25" y1="40" x2="310" y2="40" stroke="#008833" stroke-width="1.5" opacity="0.5"/>
        <line x1="295" y1="40" x2="310" y2="28" stroke="#008833" stroke-width="1.5" opacity="0.5"/>
        
        <g transform="translate(720, 28)">
            <circle cx="0" cy="-4" r="4" class="blink"/>
            <text x="12" y="0" class="live-text" style="font-size: 12px; font-weight: bold; letter-spacing: 2px;">LIVE</text>
        </g>
        
        <g transform="translate(25, 65)">
            <text x="0" y="0" class="dim label">TOTAL_CONTRIBUTIONS</text>
            <text x="0" y="46" class="green big-number glitch">1310</text>
            <text x="0" y="72" class="dim label">TOTAL_COMMITS: <tspan class="white">452</tspan></text>
        </g>

        <g transform="translate(290, 52)">
            <rect x="0" y="0" width="240" height="105" fill="rgba(0,136,51,0.05)" stroke="#008833" stroke-width="1" rx="6" opacity="0.3"/>
            <text x="18" y="22" class="dim label">CURRENT_STREAK</text>
            <text x="18" y="56" class="magenta stat-value" style="font-size: 30px;">7 <tspan class="dim" style="font-size: 14px">DAYS</tspan></text>
            
            <text x="18" y="82" class="dim label">LONGEST_STREAK: <tspan class="white">16 DAYS</tspan></text>
        </g>

        <g transform="translate(565, 65)">
            <g transform="translate(0, 0)">
                <text x="0" y="0" class="dim label">TOP_LANGUAGE</text>
                <text x="0" y="24" class="cyan stat-value">Java</text>
            </g>
            
            <g transform="translate(0, 60)">
                <text x="0" y="0" class="dim label">MOST_ACTIVE_DAY</text>
                <text x="0" y="24" class="orange stat-value">N/A</text>
            </g>
        </g>
        
        <text x="740" y="168" class="dim" style="font-size: 9px;">v3.0_SLIM</text>
    </svg>